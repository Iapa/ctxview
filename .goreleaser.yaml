version: 2

project_name: ctxview

before:
  hooks:
    - go test ./...

builds:
  - id: ctxview
    main: .
    binary: ctxview
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: ctxview
    repository:
      owner: Iapa
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Iapa/ctxview
    description: Local Context Window Inspector and reverse-proxy analyzer for LLM coding agents
    license: MIT
    commit_author:
      name: Iapa
      email: Iapa@users.noreply.github.com
    commit_msg_template: "ctxview {{ .Tag }}"
    custom_block: |
      head do
        url "https://github.com/Iapa/ctxview.git", branch: "main"
        depends_on "go" => :build
      end
    install: |
      if build.head?
        system "go", "build", *std_go_args(ldflags: "-s -w -X main.version=HEAD"), "."
      else
        bin.install "ctxview"
      end
    service: |
      run [opt_bin/"ctxview"]
      environment_variables CTXVIEW_PORT: "8787"
      keep_alive true
      log_path var/"log/ctxview.log"
      error_log_path var/"log/ctxview.log"
    test: |
      assert_match(/\S+/, shell_output("#{bin}/ctxview -version").strip)

